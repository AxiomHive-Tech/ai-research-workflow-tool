[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-workflow-tool"
version = "1.0.0"
description = "A Python CLI that turns research requests into gated work orders and assistant-ready prompts"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "Repository contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
build = ["build>=1.2"]

[project.scripts]
ai-workflow = "ai_workflow_tool:main"
unified-workflow = "unified_workflow:main"

[tool.setuptools]
py-modules = ["ai_workflow_tool", "unified_workflow", "conversation_store", "security_policy"]

[tool.setuptools.data-files]
"share/ai-research-workflow-tool" = ["workflow.schema.json", "unified_system.schema.json", "unified_system.example.json", "timethread_schema.sql"]

[tool.setuptools.packages.find]
include = []
